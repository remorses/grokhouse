<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- Paper grain: faint fibres and specks, multiplied over the cream. -->
  <filter id="grain" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 -2.2 1.25"/>
  </filter>
  <rect width="360" height="360" filter="url(#grain)" opacity="0.18"/>
</svg>
